<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldBuilder Remake</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="menu" class="screen"></div>
    <div id="game" class="screen hidden">
      <canvas id="canvas"></canvas>
      <div id="hud">
        <div id="hud-top">
          <span id="mission-label"></span>
          <span id="goal-status"></span>
          <button id="btn-menu">메뉴</button>
        </div>
        <div id="hud-left">
          <div id="unit-info" class="hidden"></div>
          <div id="actions"></div>
        </div>
        <div id="hud-bottom">
          <div id="plans"></div>
        </div>
        <div id="banner" class="hidden"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
