<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldBuilder Remake</title>
  <script type="module" crossorigin src="/remake-old-flash-game-by-claude/assets/index-B1es8WYn.js"></script>
  <link rel="stylesheet" crossorigin href="/remake-old-flash-game-by-claude/assets/index-1bjkMc3E.css">
</head>
<body>
  <div id="app">
    <div id="menu" class="screen"></div>
    <div id="game" class="screen hidden">
      <canvas id="canvas"></canvas>
      <div id="hud">
        <div id="hud-top">
          <span id="mission-label"></span>
          <span id="goal-status"></span>
          <button id="btn-pause">일시정지 (P)</button>
          <button id="btn-retry">재시도 (R)</button>
          <button id="btn-menu">메뉴</button>
        </div>
        <div id="hud-left">
          <div id="unit-info" class="hidden"></div>
          <div id="actions"></div>
        </div>
        <div id="hud-bottom">
          <div id="plans"></div>
        </div>
        <div id="banner" class="hidden"></div>
      </div>
    </div>
  </div>
</body>
</html>
